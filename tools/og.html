<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/style.css">
<style>
  html,body{margin:0;background:#241914}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;background:radial-gradient(60% 80% at 28% 55%,rgba(217,163,95,.28),transparent 70%),radial-gradient(50% 60% at 90% 0%,rgba(80,60,110,.25),transparent 70%),#241914;font-family:var(--sans)}
  .rug{position:absolute;left:70px;top:120px;width:540px;perspective:1200px}
  .rug img{width:100%;display:block;transform:rotateX(22deg) rotateZ(-3deg);box-shadow:0 0 70px rgba(233,190,120,.35);border-left:9px solid transparent}
  .shadow{position:absolute;left:150px;top:520px;width:400px;height:50px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent)}
  .copy{position:absolute;left:680px;top:170px;width:460px;color:#efe3cc}
  .mark{width:420px;height:102px;background:#EBDBBE;-webkit-mask:url(/images/brand/wordmark-hd.png) center/contain no-repeat;mask:url(/images/brand/wordmark-hd.png) center/contain no-repeat}
  .line{margin-top:34px;font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:#d9a35f}
  .sub{margin-top:18px;font-family:var(--serif);font-style:italic;font-weight:300;font-size:34px;line-height:1.25;color:#f5efe4}
  .url{position:absolute;left:680px;bottom:70px;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:rgba(239,227,204,.6)}
</style></head><body>
<div class="og">
  <div class="shadow"></div>
  <div class="rug"><img src="/images/collection/midnight-bloom-flight.jpg" alt=""></div>
  <div class="copy"><div class="mark"></div><div class="line">Handmade Turkish Silk Rugs</div><div class="sub">Woven in Cappadocia, certified handmade, for collectors and the trade.</div></div>
  <div class="url">professiorugs.com</div>
</div>
</body></html>
